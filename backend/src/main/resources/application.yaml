spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://localhost:3306/Errorlog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

frontend:
  url: ${FRONTEND_URL}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000       # 1시간 (ms)
  refresh-token-expiration: 1209600000   # 14일 (ms)

email:
  verification:
    expiration: 300   # 5분 (초)
